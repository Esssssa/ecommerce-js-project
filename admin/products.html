<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Products</title>
</head>
<body>
    <div id="menu"></div>
    <h2 id="title">Add Product</h2>
    <p>Name: <input type="text" id="name"></p>
    <p>Image URL: <input type="text" id="image"></p>
    <p>Category: <select id="category"></select></p>
    <p>Price: <input type="number" id="price"></p>
    <p>Stock Quantity: <input type="number" id="stock"></p>
    <p>Description: <br><textarea id="description" rows="3" cols="30"></textarea></p>
    <p id="error" style="color:red"></p>
    <button onclick="save()" id="saveBtn">Add</button>
    <button onclick="cancelEdit()">Cancel</button>

    <h2>All Products</h2>
    <table border="1" cellpadding="5">
        <tr><th>ID</th><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Description</th><th>Actions</th></tr>
        <tbody id="list"></tbody>
    </table>

    <script src="../app.js"></script>
    <script>
        checkAdmin();
        showAdminMenu();
        let editId = null;
        loadCategories();
        show();

        function loadCategories() {
            let html = '<option value="">-- choose --</option>';
            getData("categories").forEach(c => {
                html += "<option value='" + c.name + "'>" + c.name + "</option>";
            });
            document.getElementById("category").innerHTML = html;
        }

        function show() {
            let html = "";
            getData("products").forEach(p => {
                html += "<tr><td>" + p.id + "</td><td><img src='" + p.image + "' width='60' alt='no image'></td><td>" +
                    p.name + "</td><td>" + p.category + "</td><td>" + p.price + "</td><td>" + p.stock +
                    "</td><td>" + p.description + "</td><td>" +
                    "<button onclick='edit(" + p.id + ")'>Edit</button> " +
                    "<button onclick='del(" + p.id + ")'>Delete</button></td></tr>";
            });
            document.getElementById("list").innerHTML = html;
        }

        function save() {
            const name = document.getElementById("name").value.trim();
            const image = document.getElementById("image").value.trim();
            const category = document.getElementById("category").value;
            const price = document.getElementById("price").value;
            const stock = document.getElementById("stock").value;
            const description = document.getElementById("description").value.trim();
            const error = document.getElementById("error");

            if (name == "" || image == "" || category == "" || price == "" || stock == "" || description == "") {
                error.innerText = "All fields are required";
                return;
            }
            if (name.length < 3) {
                error.innerText = "Name must be at least 3 characters";
                return;
            }
            if (image.indexOf("http") != 0) {
                error.innerText = "Image must be a link starting with http";
                return;
            }
            if (Number(price) <= 0) {
                error.innerText = "Price must be more than 0";
                return;
            }
            if (Number(stock) < 0 || stock.indexOf(".") != -1) {
                error.innerText = "Stock must be a whole number, 0 or more";
                return;
            }
            if (description.length < 10) {
                error.innerText = "Description must be at least 10 characters";
                return;
            }

            const products = getData("products");
            if (editId == null) {
                products.push({
                    id: nextId(products), name: name, image: image, category: category,
                    price: Number(price), stock: Number(stock), description: description
                });
            } else {
                const p = products.find(p => p.id == editId);
                p.name = name;
                p.image = image;
                p.category = category;
                p.price = Number(price);
                p.stock = Number(stock);
                p.description = description;
            }
            saveData("products", products);
            cancelEdit();
            show();
        }

        function edit(id) {
            const p = getData("products").find(p => p.id == id);
            document.getElementById("name").value = p.name;
            document.getElementById("image").value = p.image;
            document.getElementById("category").value = p.category;
            document.getElementById("price").value = p.price;
            document.getElementById("stock").value = p.stock;
            document.getElementById("description").value = p.description;
            editId = id;
            document.getElementById("title").innerText = "Edit Product";
            document.getElementById("saveBtn").innerText = "Update";
        }

        function cancelEdit() {
            editId = null;
            document.getElementById("name").value = "";
            document.getElementById("image").value = "";
            document.getElementById("category").value = "";
            document.getElementById("price").value = "";
            document.getElementById("stock").value = "";
            document.getElementById("description").value = "";
            document.getElementById("error").innerText = "";
            document.getElementById("title").innerText = "Add Product";
            document.getElementById("saveBtn").innerText = "Add";
        }

        function del(id) {
            if (!confirm("Delete this product?")) return;
            saveData("products", getData("products").filter(p => p.id != id));
            show();
        }
    </script>
</body>
</html>
