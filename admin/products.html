<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Products</title>
</head>
<body>
    <div id="menu"></div>
    <h2 id="title">Add Product</h2>
    <p>Name: <input type="text" id="name"></p>
    <p>Image URL: <input type="text" id="image"></p>
    <p>Category: <select id="category"></select></p>
    <p>Price: <input type="number" id="price"></p>
    <p>Stock Quantity: <input type="number" id="stock"></p>
    <p>Description: <br><textarea id="description" rows="3" cols="30"></textarea></p>
    <p id="error" style="color:red"></p>
    <button onclick="save()" id="saveBtn">Add</button>
    <button onclick="cancelEdit()">Cancel</button>

    <h2>All Products</h2>
    <table border="1" cellpadding="5">
        <tr><th>ID</th><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Description</th><th>Actions</th></tr>
        <tbody id="list"></tbody>
    </table>

    <script src="../scripts/app.js"></script>
    <script src="../scripts/admin-products.js"></script>
</body>
</html>
