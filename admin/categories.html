<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Categories</title>
</head>
<body>
    <div id="menu"></div>
    <h2 id="title">Add Category</h2>
    <p>Name: <input type="text" id="name"></p>
    <p id="error" style="color:red"></p>
    <button onclick="save()" id="saveBtn">Add</button>
    <button onclick="cancelEdit()">Cancel</button>

    <h2>All Categories</h2>
    <table border="1" cellpadding="5">
        <tr><th>ID</th><th>Name</th><th>Actions</th></tr>
        <tbody id="list"></tbody>
    </table>

    <script src="../app.js"></script>
    <script>
        checkAdmin();
        showAdminMenu();
        let editId = null;
        show();

        function show() {
            let html = "";
            getData("categories").forEach(c => {
                html += "<tr><td>" + c.id + "</td><td>" + c.name + "</td><td>" +
                    "<button onclick='edit(" + c.id + ")'>Edit</button> " +
                    "<button onclick='del(" + c.id + ")'>Delete</button></td></tr>";
            });
            document.getElementById("list").innerHTML = html;
        }

        function save() {
            const name = document.getElementById("name").value.trim();
            const error = document.getElementById("error");
            const cats = getData("categories");

            if (name == "") {
                error.innerText = "Category name is required";
                return;
            }
            if (name.length < 3) {
                error.innerText = "Category name must be at least 3 characters";
                return;
            }
            if (cats.some(c => c.name.toLowerCase() == name.toLowerCase() && c.id != editId)) {
                error.innerText = "This category already exists";
                return;
            }

            if (editId == null) {
                cats.push({ id: nextId(cats), name: name });
            } else {
                const cat = cats.find(c => c.id == editId);
                const oldName = cat.name;
                cat.name = name;
                // keep products in sync with the new name
                const products = getData("products");
                products.forEach(p => {
                    if (p.category == oldName) p.category = name;
                });
                saveData("products", products);
            }
            saveData("categories", cats);
            cancelEdit();
            show();
        }

        function edit(id) {
            const cat = getData("categories").find(c => c.id == id);
            document.getElementById("name").value = cat.name;
            editId = id;
            document.getElementById("title").innerText = "Edit Category";
            document.getElementById("saveBtn").innerText = "Update";
        }

        function cancelEdit() {
            editId = null;
            document.getElementById("name").value = "";
            document.getElementById("error").innerText = "";
            document.getElementById("title").innerText = "Add Category";
            document.getElementById("saveBtn").innerText = "Add";
        }

        function del(id) {
            const cats = getData("categories");
            const cat = cats.find(c => c.id == id);
            if (getData("products").some(p => p.category == cat.name)) {
                alert("Cannot delete, there are products in this category");
                return;
            }
            if (!confirm("Delete this category?")) return;
            saveData("categories", cats.filter(c => c.id != id));
            show();
        }
    </script>
</body>
</html>
