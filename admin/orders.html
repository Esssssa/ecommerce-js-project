<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Orders</title>
</head>
<body>
    <div id="menu"></div>
    <h2>All Orders</h2>
    <table border="1" cellpadding="5">
        <tr><th>ID</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Actions</th></tr>
        <tbody id="list"></tbody>
    </table>

    <script src="../app.js"></script>
    <script>
        checkAdmin();
        showAdminMenu();
        show();

        function show() {
            let html = "";
            getData("orders").forEach(o => {
                const items = o.items.map(i => i.name + " x" + i.qty).join(", ");
                html += "<tr><td>" + o.id + "</td><td>" + o.date + "</td><td>" + o.customer + "</td><td>" + items +
                    "</td><td>" + o.total + "</td><td>" + o.status + "</td><td>";
                if (o.status == "pending") {
                    html += "<button onclick='changeStatus(" + o.id + ", \"confirmed\")'>Confirm</button> " +
                        "<button onclick='changeStatus(" + o.id + ", \"rejected\")'>Reject</button>";
                }
                html += "</td></tr>";
            });
            document.getElementById("list").innerHTML = html;
        }

        function changeStatus(id, status) {
            const orders = getData("orders");
            const order = orders.find(o => o.id == id);
            order.status = status;

            // stock was taken when the customer placed the order, give it back if rejected
            if (status == "rejected") {
                const products = getData("products");
                order.items.forEach(i => {
                    const p = products.find(p => p.id == i.id);
                    if (p) p.stock += i.qty;
                });
                saveData("products", products);
            }
            saveData("orders", orders);
            show();
        }
    </script>
</body>
</html>
