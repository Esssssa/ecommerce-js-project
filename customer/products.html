<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Products</title>
</head>
<body>
    <div id="menu"></div>
    <h2>Products</h2>

    Search: <input type="text" id="search" oninput="show()">
    Category: <select id="category" onchange="show()"></select>
    Max price: <input type="number" id="maxPrice" oninput="show()">
    <button onclick="clearFilters()">Clear</button>
    <p id="message" style="color:green"></p>

    <table border="1" cellpadding="5">
        <tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Description</th><th>Actions</th></tr>
        <tbody id="list"></tbody>
    </table>

    <script src="../app.js"></script>
    <script>
        checkCustomer();
        showCustomerMenu();
        loadCategories();
        show();

        function loadCategories() {
            let html = '<option value="">All</option>';
            getData("categories").forEach(c => {
                html += "<option value='" + c.name + "'>" + c.name + "</option>";
            });
            document.getElementById("category").innerHTML = html;
        }

        function clearFilters() {
            document.getElementById("search").value = "";
            document.getElementById("category").value = "";
            document.getElementById("maxPrice").value = "";
            show();
        }

        function show() {
            const search = document.getElementById("search").value.trim().toLowerCase();
            const category = document.getElementById("category").value;
            const maxPrice = document.getElementById("maxPrice").value;
            const wish = getData(wishKey());

            const products = getData("products").filter(p => {
                if (search != "" && p.name.toLowerCase().indexOf(search) == -1) return false;
                if (category != "" && p.category != category) return false;
                if (maxPrice != "" && p.price > Number(maxPrice)) return false;
                return true;
            });

            let html = "";
            products.forEach(p => {
                const inWish = wish.includes(p.id);
                html += "<tr><td><img src='" + p.image + "' width='60' alt='no image'></td><td>" +
                    p.name + "</td><td>" + p.category + "</td><td>" + p.price + "</td><td>" +
                    (p.stock > 0 ? p.stock : "Out of stock") + "</td><td>" + p.description + "</td><td>";
                if (p.stock > 0) {
                    html += "<button onclick='addToCart(" + p.id + ")'>Add to Cart</button> ";
                }
                html += "<button onclick='toggleWish(" + p.id + ")'>" +
                    (inWish ? "Remove from Wish List" : "Add to Wish List") + "</button></td></tr>";
            });
            if (products.length == 0) {
                html = "<tr><td colspan='7'>No products found</td></tr>";
            }
            document.getElementById("list").innerHTML = html;
        }

        function addToCart(id) {
            const cart = getData(cartKey());
            const product = getData("products").find(p => p.id == id);
            const item = cart.find(i => i.id == id);

            if (item) {
                if (item.qty + 1 > product.stock) {
                    document.getElementById("message").innerText = "";
                    alert("Only " + product.stock + " of " + product.name + " in stock");
                    return;
                }
                item.qty++;
            } else {
                cart.push({ id: id, qty: 1 });
            }
            saveData(cartKey(), cart);
            document.getElementById("message").innerText = product.name + " added to cart";
        }

        function toggleWish(id) {
            let wish = getData(wishKey());
            if (wish.includes(id)) {
                wish = wish.filter(w => w != id);
            } else {
                wish.push(id);
            }
            saveData(wishKey(), wish);
            show();
        }
    </script>
</body>
</html>
