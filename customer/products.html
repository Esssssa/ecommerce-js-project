<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Products</title>
</head>
<body>
    <div id="menu"></div>
    <h2>Products</h2>

    Search: <input type="text" id="search" oninput="show()">
    Category: <select id="category" onchange="show()"></select>
    Max price: <input type="number" id="maxPrice" oninput="show()">
    <button onclick="clearFilters()">Clear</button>
    <p id="message" style="color:green"></p>

    <table border="1" cellpadding="5">
        <tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Description</th><th>Actions</th></tr>
        <tbody id="list"></tbody>
    </table>

    <script src="../scripts/app.js"></script>
    <script src="../scripts/customer-products.js"></script>
</body>
</html>
