<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cart</title>
</head>
<body>
    <div id="menu"></div>
    <h2>My Cart</h2>
    <p id="error" style="color:red"></p>
    <p id="message" style="color:green"></p>
    <table border="1" cellpadding="5">
        <tr><th>Name</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th>Actions</th></tr>
        <tbody id="list"></tbody>
    </table>
    <h3>Total: <span id="total">0</span></h3>
    <button onclick="placeOrder()">Place Order</button>

    <script src="../scripts/app.js"></script>
    <script src="../scripts/customer-cart.js"></script>
</body>
</html>
